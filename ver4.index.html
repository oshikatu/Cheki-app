<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#22252B;--sub:#6B7280;--acc:#E4457B;--soft:#FCE4EC;--line:#D9DEE6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161A;--card:#1F2227;--ink:#ECEEF1;--sub:#9AA1AD;--acc:#FF6B9A;--soft:#3A1F2A;--line:#323741;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161A;--card:#1F2227;--ink:#ECEEF1;--sub:#9AA1AD;--acc:#FF6B9A;--soft:#3A1F2A;--line:#323741;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Zen Maru Gothic',-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
main{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:20px;margin:0}h2{margin:0 0 12px;font-size:18px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar button{padding:8px 12px;font-size:18px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;color:var(--sub);font-size:12px;padding:4px 0}
.day{aspect-ratio:1/1.15;background:var(--card);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;font-size:13px;border:1px solid var(--line)}
.day b{margin-top:auto;align-self:center;background:var(--acc);color:var(--onacc);border-radius:99px;font-size:11px;padding:0 6px}
.day.today{outline:2px solid var(--acc)}
.tot{text-align:right;color:var(--sub);margin:12px 4px}
details{border-bottom:1px solid var(--line);padding:2px 0}summary{padding:12px 0;font-weight:700;cursor:pointer}details[open] summary{color:var(--acc)}details .hint{margin:0 0 12px;line-height:1.7}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}.cc h3{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:700}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}.hb{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.hn{flex:0 0 84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}.ht i{display:block;height:100%;background:var(--acc);border-radius:6px}.hb b{flex:0 0 auto;min-width:70px;text-align:right;font-weight:600}.hb2{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13px}.hbb{flex:1;min-width:0}.hl{display:flex;align-items:center;gap:8px;margin:3px 0}.hl .ht{height:9px}.hl b{flex:0 0 auto;min-width:70px;text-align:right;font-weight:600;font-size:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.ch h3{margin:0}.ch button{font-size:12px;color:var(--acc);padding:4px 10px;border:1px solid var(--line);border-radius:12px;white-space:nowrap}.csr{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}.csr span{flex:1}.csr b{color:var(--acc);width:24px;text-align:right}
.sb{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}.sb i{display:block;height:100%}
.smb{position:fixed;inset:0;z-index:5}.smp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(300px,86vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:6;overflow:hidden}.smp button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}.smp button:last-child{border:0}.smp small{color:var(--sub);font-size:12px}.smp .on{color:var(--acc);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{touch-action:manipulation;flex:1;padding:14px 0;color:var(--sub)}nav .on{color:var(--acc);font-weight:700}
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.pane{background:var(--card);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.ev{display:grid;width:100%;text-align:left;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;grid-template-columns:1fr auto;gap:2px}
.ev small{grid-column:1/-1;color:var(--sub)}
.sub{color:var(--sub)}
.pri{background:var(--acc);color:var(--onacc);border-radius:10px;padding:12px;width:100%;font-weight:700;margin-top:6px}
.pri.sm{width:auto;padding:8px 16px;margin:0}
.del{color:#d33}.del.wide{width:100%;padding:12px;margin-top:6px}
.full{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:6}
.full .in{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 90px}
.inp{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.hint{color:var(--sub);font-size:13px;margin:8px 2px 14px}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.frame{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 8px 0;box-shadow:0 2px 6px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none;cursor:pointer}
.frame:nth-child(odd){transform:rotate(-1deg)}.frame:nth-child(even){transform:rotate(1deg)}

 <p class="tot">この月：${c}枚 ${yen(a)}</p>${cdView()}`}

const SER={n:{name:'枚数',col:'var(--acc)'},c:{name:'チェキ代',col:'var(--acc)'},t:{name:'チケット代',col:'#5B8DEF'},d:{name:'ドリンク代',col:'#F2A93B'},r:{name:'交通費',col:'#48B38D'}};
function trendMonths(){const y=cur.getFullYear(),m=cur.getMonth();if(scope==='yr')return [...Array(12)].map((_,i)=>({y,m:i}));let ey=y,em=m;if(scope!=='mon'){const n=new Date();ey=n.getFullYear();em=n.getMonth();const ds=S.events.map(e=>e.date).sort(),L=ds[ds.length-1];if(L){const a=L.split('-'),ly=+a[0],lm=+a[1]-1;if(ly*12+lm>ey*12+em){ey=ly;em=lm}}}return [...Array(12)].map((_,i)=>{const t=ey*12+em-11+i;return{y:Math.floor(t/12),m:t%12}})}
function monthVals(){return trendMonths().map(({y,m})=>{const k=y+'-'+pad(m+1),es=S.events.filter(e=>e.date.slice(0,7)===k);return{y,m,n:es.reduce((a,e)=>a+evSum(e).c,0),c:es.reduce((n,e)=>n+evSum(e).a,0),t:es.reduce((n,e)=>n+(e.tk||0),0),d:es.reduce((n,e)=>n+(e.dr||0),0),r:es.reduce((n,e)=>n+(e.tr||0),0)}})}
function trendCard(keys,title){const vals=monthVals(),ser=keys.map(k=>({k,...SER[k]})),tot=v=>ser.reduce((a,x)=>a+(v[x.k]||0),0),mx=Math.max(1,...vals.map(tot));if(!vals.some(v=>tot(v)>0))return '';const W=340,H=158,pl=6,pr=6,pt=20,pb=34,iw=W-pl-pr,ih=H-pt-pb,n=vals.length,bw=iw/n*.62;let cal='',g=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" style="stroke:var(--line)"/>`;vals.forEach((v,i)=>{const x=pl+iw/n*i+(iw/n-bw)/2,key=v.y+'-'+pad(v.m+1),dim=tsel&&tsel!==key;let y=pt+ih;ser.forEach(s=>{const hh=(v[s.k]||0)/mx*ih;if(hh>0){y-=hh;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh,1).toFixed(1)}" rx="2" style="fill:${s.col}${dim?';opacity:.35':''}"/>`}});g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-18}" text-anchor="middle" font-size="9.5" style="fill:var(--sub)">${v.m+1}</text>`;if(i===0||v.m===0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8.5" style="fill:var(--sub)">${v.y}</text>`;g+=`<rect x="${(pl+iw/n*i).toFixed(1)}" y="0" width="${(iw/n).toFixed(1)}" height="${H}" data-act="tbar" data-v="${key}" style="fill:transparent;cursor:pointer"/>`;if(tsel===key)cal=`${v.y}年${v.m+1}月　${ser.length>1?'合計 ':''}${keys[0]==='n'?tot(v)+'枚':yen(tot(v))}`});g+=`<text x="${pl}" y="12" font-size="10" style="fill:var(--sub)">最大 ${keys[0]==='n'?mx+'枚':yen(mx)}</text>`+(cal?`<text x="${W-pr}" y="12" text-anchor="end" font-size="11" font-weight="700" style="fill:var(--acc)">${cal}</text>`:'');return `<div class="cc"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">${g}</svg><div class="lg">${ser.map(x=>`<span><i style="background:${x.col}"></i>${x.name}</span>`).join('')}<span>棒をタップすると数値が出ます</span></div></div>`}

function galItems(){const r=[];S.events.forEach(e=>(e.imgs||[]).forEach((o,i)=>r.push({e,o,i})));return r.sort((a,b)=>b.e.date.localeCompare(a.e.date)||a.i-b.i)}
function galSheet(){const all=galItems(),f=gal.f||'all',gm=gal.m||null,tg=x=>x.o.m||[],gg=x=>x.o.g||[];
 const base=f==='all'?all:f==='none'?all.filter(x=>!tg(x).length):f==='ng'?all.filter(x=>tg(x).length&&!gg(x).length):all.filter(x=>gg(x).includes(f.slice(2)));
 const L=gm?all.filter(x=>tg(x).includes(gm)):base;
 const gl=[...new Set(all.flatMap(gg))].sort(cmpN);
 const ms2=f.startsWith('g:')?SM().filter(m=>m.group===f.slice(2)&&imgCount(m.id)):f==='ng'?SM().filter(m=>!m.group&&imgCount(m.id)):[];
 return `<div class="full ov"><div class="in"><div class="bar"><button data-act="galx">‹ 戻る</button><strong>画像</strong><span style="width:70px"></span></div><div class="chips"><button class="${f==='all'?'on':''}" data-act="gf" data-v="all">すべて (${all.length})</button>${gl.map(g=>`<button class="grp${f==='g:'+g?' on':''}" data-act="gf" data-v="g:${esc(g)}">${esc(g)} (${all.filter(x=>gg(x).includes(g)).length})</button>`).join('')}${all.some(x=>tg(x).length&&!gg(x).length)?`<button class="grp${f==='ng'?' on':''}" data-act="gf" data-v="ng">グループなし</button>`:''}${all.some(x=>!tg(x).length)?`<button class="${f==='none'?'on':''}" data-act="gf" data-v="none">タグなし</button>`:''}</div>${ms2.length?`<div class="chips sub2"><button class="${gm?'':'on'}" data-act="gm" data-v="">すべて</button>${ms2.map(m=>`<button class="${gm===m.id?'on':''}" data-act="gm" data-v="${m.id}">${m.fav?'👑 ':''}${esc(m.name)} (${imgCount(m.id)})</button>`).join('')}</div>`:''}${L.length?`<div class="gg">${L.map(x=>`<button class="gi" data-act="lbo" data-e="${x.e.id}" data-v="${x.i}"><img src="${x.o.u}" alt=""></button>`).join('')}</div>`:'<p class="sub">画像がありません</p>'}</div></div>`}
function lbSheet(){const e=S.events.find(y=>y.id===lb.e),o=e&&e.imgs&&e.imgs[lb.i];if(!o)return '';const p=e.date.split('-');
 return `<div class="lbx" data-act="lbx"><button class="lbclose" data-act="lbx" aria-label="閉じる">×</button><img src="${o.u}" alt=""><div class="lbc"><div>${esc(e.name||'名称なし')}　${+p[0]}年${+p[1]}月${+p[2]}日</div><div>${(o.g||[]).map(g=>`<span class="tg grp">${esc(g)}</span>`).join(' ')} ${SM().filter(m=>(o.m||[]).includes(m.id)).map(m=>`<span class="tg">${m.fav?'👑':''}${esc(m.name)}</span>`).join(' ')}</div><button class="pri" data-act="lbm" style="width:auto;padding:8px 18px">イベントのメモを開く</button></div></div>`}
const hp=()=>S.hp||(S.hp=[]);
function pdelSheet(){return `<div class="back top" data-act="pdcl"><div class="pane"><h2>候補から外す</h2><p>「${yen(pdel)}」を金額の候補から外します。これまでの記録は変わりません。</p><div class="cpr"><button data-act="pdcl" style="padding:12px 16px">キャンセル</button><button class="pri" data-act="pdok" style="margin:0">外す</button></div></div></div>`}
let l3=null,l3f=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-act="cp"],[data-act="padd"]');if(!b||b.dataset.v==='')return;l3f=false;b.classList.add('hold');const p=+b.dataset.v;l3=setTimeout(()=>{l3=null;l3f=true;pdel=p;render()},1000)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(l3){clearTimeout(l3);l3=null;document.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'))}}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-act="cp"],[data-act="padd"]'))e.preventDefault()});
const backfillG=()=>S.events.forEach(e=>(e.imgs||[]).forEach(o=>{if(!o.g)o.g=[...new Set((o.m||[]).map(id=>{const q=mem(id);return q&&q.group}).filter(Boolean))]}));
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function pipeZ(data,C){const st=new Blob([data]).stream().pipeThrough(new C('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function enc(o){const j=JSON.stringify(o);if(typeof CompressionStream==='undefined')return j;return 'CK1:'+b64(await pipeZ(new TextEncoder().encode(j),CompressionStream))}
async function dec(t){t=(t||'').trim();try{if(t.startsWith('CK1:')){return JSON.parse(new TextDecoder().decode(await pipeZ(unb64(t.slice(4).replace(/\s+/g,'')),DecompressionStream)))}return JSON.parse(t)}catch(x){return null}}
async function mkBackup(){const raw=JSON.stringify(S).length;try{bout=await enc({...S,_t:T})}catch(x){bout=JSON.stringify({...S,_t:T})}binfo='圧縮: '+Math.round(raw/1024)+'KB → '+Math.round(bout.length/1024)+'KB';if(bk)render()}
const arm=k=>{if(armed===k){armed=null;return true}armed=k;return false};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,v=t.dataset.v;
 if((a==='close'||a==='pclose'||a==='bclose'||a==='hclose'||a==='cclose'||a==='tclose'||a==='jclose'||a==='gdcl'||a==='ecl'||a==='icl'||a==='lbx'||a==='pdcl')&&e.target!==t)return;
 if(!['delev','delm','brest'].includes(a))armed=null;
 if(a==='tab'){if(v==='sum'){const n=Date.now();if(n-lastSum<400){smenu=true;lastSum=0}else{lastSum=n;tab='sum';sm='sum';sel=null;mdet=null;mq='';fc=false}}else{tab=v;sel=null;mdet=null;mq='';fc=false}}
 else if(a==='smode'){sm=v;tab='sum';smenu=false;sel=null;mdet=null;fc=false}
 else if(a==='smc')smenu=false;
 else if(a==='cedit'){editEv=v;curP=null;eqv='';fc=true}
 else if(a==='mon')cur.setMonth(cur.getMonth()+ +v);
 else if(a==='day')sel=v;
 else if(a==='close'){if(editMem)editMem=null;else if(mdet)mdet=null;else sel=null}
 else if(a==='add'){const x={id:uid(),date:sel,name:'',items:[]};S.events.push(x);editEv=x.id;curP=null;eqv='';fc=false;save()}
 else if(a==='edit'){if(l2f)l2f=false;else{editEv=v;curP=null;eqv='';fc=false}}
 else if(a==='ecl')emo=null;
 else if(a==='itag')itg=+v;
 else if(a==='icl')itg=null;
 else if(a==='galo')gal={f:'all',m:null};
 else if(a==='mgal'){const mm=mem(v);gal={f:mm&&mm.group?'g:'+mm.group:'ng',m:v}}
 else if(a==='gf'){gal.f=v;gal.m=null}
 else if(a==='gm')gal.m=v||null;
 else if(a==='galx')gal=null;
 else if(a==='lbo')lb={e:t.dataset.e,i:+v};
 else if(a==='lbx')lb=null;
 else if(a==='lbm'){emo=lb.e;emsg=''}
 else if(a==='pdcl')pdel=null;
 else if(a==='pdok'){if(!hp().includes(pdel))hp().push(pdel);if(curP===pdel)curP=null;pdel=null;save()}
 else if(a==='itog'){const x=S.events.find(y=>y.id===emo),o=x&&x.imgs&&x.imgs[itg];if(o){o.m=o.m||[];o.g=o.g||[];const k=o.m.indexOf(v),mm=mem(v),g=mm&&mm.group;
  if(k>=0){o.m.splice(k,1);if(g&&!o.m.some(id=>{const q=mem(id);return q&&q.group===g}))o.g=o.g.filter(z=>z!==g)}
  else{o.m.push(v);if(g&&!o.g.includes(g))o.g.push(g)}save()}}
 else if(a==='eidel'){const x=S.events.find(y=>y.id===emo);if(x&&x.imgs){x.imgs.splice(+v,1);save()}}
 else if(a==='plus'){if(curP===null)pick=v;else{ev().items.push({m:v,p:curP});save()}}
 else if(a==='cp'){if(l3f)l3f=false;else curP=v===''?null:+v}
 else if(a==='pn'){ev().name=recentNames()[+v];save()}
 else if(a==='cpset'){const p=parseInt($('#cpi').value);if(p>=0){curP=p;S.hp=hp().filter(x=>x!==p);save()}}
 else if(a==='padd'){if(l3f)l3f=false;else{ev().items.push({m:pick,p:+v});pick=null;save()}}
 else if(a==='pcustom'){const p=parseInt($('#pp').value),qs=$('#pq').value.trim(),q=qs===''?1:Math.min(99,parseInt(qs));
  if(p>=0&&q>=1){const nc=qs!=='';for(let k=0;k<q;k++)ev().items.push(nc?{m:pick,p,nc:1}:{m:pick,p});if(!nc)S.hp=hp().filter(x=>x!==p);pick=null;save()}}
 else if(a==='pclose')pick=null;
 else if(a==='minus'){const x=ev();const i=x.items.map(y=>y.m).lastIndexOf(v);if(i>=0)x.items.splice(i,1);save()}
 else if(a==='done'){const x=ev();if(!x.name&&!x.items.length)S.events=S.events.filter(y=>y!==x);else sel=x.date;editEv=null;if(fc){sel=null;fc=false}save()}
 else if(a==='delev'){if(arm('delev')){S.events=S.events.filter(y=>y.id!==editEv);editEv=null;save()}}
 else if(a==='scope')scope=v;
 else if(a==='ssort')sumSort=v;
 else if(a==='yr')cur.setFullYear(cur.getFullYear()+ +v);
 else if(a==='jump')jy=cur.getFullYear();
 else if(a==='jclose')jy=null;
 else if(a==='jy')jy+= +v;
 else if(a==='jm'){cur=new Date(jy,+v,1);jy=null}
 else if(a==='jthis'){cur=new Date();cur.setDate(1);jy=null}
 else if(a==='mdet')mdet=v;
 else if(a==='gocal'){if(l2f)l2f=false;else{const p=v.split('-');cur=new Date(+p[0],+p[1]-1,1);mdet=null;tab='cal';sel=v}}
 else if(a==='cok'){const k=240/280,c=document.createElement('canvas');c.width=c.height=240;c.getContext('2d').drawImage(crop.im,crop.ox*k,crop.oy*k,crop.im.width*crop.s*k,crop.im.height*crop.s*k);editMem.img=c.toDataURL('image/jpeg',.85);crop=null}
 else if(a==='cxcl')crop=null;
 else if(a==='fav')editMem.fav=!editMem.fav;
 else if(a==='gdcl')gdel=null;
 else if(a==='esort'){evSort=v;try{localStorage.setItem('cheki-evsort',v)}catch(x){}}
 else if(a==='gdok'){if(!hg().includes(gdel))hg().push(gdel);gdel=null;save()}
 else if(a==='fin'){const x=ev();if(!x.name&&!x.items.length)S.events=S.events.filter(y=>y!==x);else{const p=x.date.split('-');cur=new Date(+p[0],+p[1]-1,1)}sel=null;editEv=null;tab=fc?'sum':'cal';fc=false;save()}
 else if(a==='readj'){const im=new Image();im.onload=()=>openCrop(im);im.src=editMem.img}
 else if(a==='pg'){if(lpFired)lpFired=false;else editMem.group=gcands()[+v]}
 else if(a==='bk'){bk=true;bmsg='';bern=false;btxt='';bout='作成中…';binfo='';mkBackup()}
 else if(a==='bclose')bk=false;
 else if(a==='help')hlp=true;
 else if(a==='hclose')hlp=false;
 else if(a==='tbar')tsel=tsel===v?null:v;
 else if(a==='csel')csh=true;
 else if(a==='cclose')csh=false;
 else if(a==='cclr'){S.csel=[];save()}
 else if(a==='ctog'){const c=S.csel||[],i=c.indexOf(v);if(i>=0)c.splice(i,1);else c.push(v);S.csel=c;save()}
 else if(a==='bsave'){if(bout.startsWith('CK1:')||bout.startsWith('{')){try{const d=new Date(),n=''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),u=URL.createObjectURL(new Blob([bout],{type:'text/plain'})),el=document.createElement('a');el.href=u;el.download='cheki-backup-'+n+'.txt';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);bmsg='ファイルを保存しました';bern=false}catch(x){bmsg='保存できませんでした';bern=true}}else{bmsg='作成中です。少し待ってからもう一度押してください';bern=false}}
 else if(a==='theme')th=true;
 else if(a==='tclose')th=false;
 else if(a==='tset'){T[t.dataset.k]=v===''?null:v;applyT();saveT()}
 else if(a==='treset'){T={bg:'#FFFFFF',ink:null,acc:'#E4457B'};applyT();saveT()}
 else if(a==='bcopy'){const ta=$('#bo');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(x){}$('#bm').className='hint';$('#bm').textContent=ok?'コピーしました':'選択しました。長押しでコピーしてください';return}
 else if(a==='brest'){dec(btxt).then(d=>{
  if(!d||!Array.isArray(d.members)||!Array.isArray(d.events)){bmsg='データの形式が正しくありません';bern=true;armed=null}
  else if(arm('brest')){d.events.forEach(x=>{if(!x.items)x.items=[]});if(d._t){T={...T,...d._t};delete d._t;applyT();saveT()}S=d;normImgs();save();bk=false}else{bmsg='';bern=false}render()});return}
 else if(a==='addm')editMem={id:uid(),name:'',price:0,img:'',isNew:true};
 else if(a==='editm')editMem={...mem(v)};
 else if(a==='savem'){if(!editMem.name.trim()){editMem.err=true}else{const m=editMem;delete m.isNew;delete m.err;m.name=m.name.trim();m.group=(m.group||'').trim();const i=S.members.findIndex(x=>x.id===m.id);if(i<0)S.members.push(m);else S.members[i]=m;editMem=null;save()}}
 else if(a==='delm'){if(arm('delm')){S.members=S.members.filter(x=>x.id!==editMem.id);editMem=null;save()}}
 render()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='emt'){const x=S.events.find(y=>y.id===emo);if(x){x.memo=t.value;save()}}
 else if(t.id==='en'){ev().name=t.value;save()}
 else if(t.id==='etk'){ev().tk=Math.max(0,parseInt(t.value)||0);save()}
 else if(t.id==='edr'){ev().dr=Math.max(0,parseInt(t.value)||0);save()}
 else if(t.id==='etr'){ev().tr=Math.max(0,parseInt(t.value)||0);save()}
 else if(t.id==='ed'&&t.value){ev().date=t.value;save()}
 else if(t.id==='mn')editMem.name=t.value;
 else if(t.id==='mg'){editMem.group=t.value;S.hg=hg().filter(x=>x!==t.value.trim())}
 else if(t.id==='bi')btxt=t.value;
 else if(t.id==='mq'){mq=t.value;const o=$('#mlist');if(o)o.innerHTML=memList()}
 else if(t.id==='eqi'){eqv=t.value;const o=$('#elist');if(o)o.innerHTML=evList()}
 else if(t.id==='cz'&&crop){zoomC(crop.min*+t.value,140,140);drawCrop()}
 else if(t.id&&t.id.startsWith('tc-')){T[t.id.slice(3)]=t.value;applyT();saveT()}
 else if(t.id==='bmo')editMem.bmo=+t.value;
 else if(t.id==='bda')editMem.bda=+t.value;
 else if(t.id==='mshow')editMem.mid=t.checked;
 else if(t.id==='obm'){me().bmo=+t.value;save()}
 else if(t.id==='obd'){me().bda=+t.value;save()}
 else if(t.id==='mp')editMem.price=Math.max(0,parseInt(t.value)||0)});
document.addEventListener('change',e=>{
 if(e.target.id==='bf'){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{btxt=String(rd.result||'');bmsg='ファイルを読み込みました。「復元する」を2回タップしてください';bern=false;render()};rd.readAsText(f);return}
 if(e.target.id!=='mf'||!e.target.files[0])return;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{openCrop(im)};im.src=r.result};
 r.readAsDataURL(e.target.files[0])});
let sw=null;
document.addEventListener('touchstart',e=>{sw=null;if(tab!=='cal'||smenu||layers()!==0||e.touches.length!==1)return;if(e.target.closest&&e.target.closest('input,textarea,select'))return;const t=e.touches[0];sw={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
document.addEventListener('touchend',e=>{if(!sw)return;const s=sw;sw=null;if(tab!=='cal'||smenu||layers()!==0)return;const t=e.changedTouches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;if(Date.now()-s.t>800||Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.6)return;const dir=dx<0?1:-1;cur.setMonth(cur.getMonth()+dir);render();const g=document.querySelector('.grid');if(g&&g.animate)g.animate([{transform:'translateX('+(dir*40)+'px)',opacity:.3},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'})},{passive:true});
backfillG();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
